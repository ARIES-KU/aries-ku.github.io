# Builds the site and publishes it to GitHub Pages.
# Repository: github.com/ARIES-KU/aries-ku.github.io  (Settings > Pages > Source: GitHub Actions)
#
# Until launch (the director chose this on 4 Oct 2026): every push to main publishes the PREVIEW, so the online
# preview is always the latest work.
#   preview: yellow banner + noindex, /next/ included, faculty entries still under review allowed
#   live:    the full launch check must pass
#   * Actions tab > "Deploy to GitHub Pages" > Run workflow > mode = preview | live, to run it by hand
#   * Settings > Pages > Unpublish site takes the site down; the next push brings it back
#   * the repository must be public (GitHub Free cannot serve Pages from a private repository)
# On launch day: Run workflow with mode = live once, then change 'preview' to 'live' in the "Mode" step below,
# so that pushes keep the live site current.
# Only people who have consented are in the repository at all (see src/lib/people.ts).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (banner + noindex) or live'
        type: choice
        options: [preview, live]
        default: preview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # a push builds the preview until launch day; Run workflow builds the mode it is given.
      # PREVIEW drives the launch check, PUBLIC_PREVIEW the banner and /next/, PUBLIC_THEME_SWITCH the look switch.
      - name: Mode
        run: |
          MODE="${{ github.event_name == 'push' && 'preview' || inputs.mode }}"
          if [ "$MODE" = "preview" ]; then V=true; else V=false; fi
          echo "Building the $MODE site"
          { echo "PREVIEW=$V"; echo "PUBLIC_PREVIEW=$V"; echo "PUBLIC_THEME_SWITCH=$V"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Launch / preview check
        run: npm run check-launch
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
