# Builds the site and publishes it to GitHub Pages.
# Repository: github.com/ARIES-KU/aries-ku.github.io  (Settings > Pages > Source: GitHub Actions)
#
# Manual only for now (26 Sep 2026): the repository is private until launch, and GitHub Free cannot serve
# Pages from a private repository, so every automatic deploy failed and e-mailed a "Run failed" notice.
#   * Actions tab > "Deploy to GitHub Pages" > Run workflow > mode = preview | live
#       preview: banner + noindex; faculty entries still under review are allowed
#       live:    the full launch check must pass
#   * the repository must be public when you run it.
# On launch day, make the repository public and add back the automatic deploy on every push:
#     push:
#       branches: [main]
# under `on:` below, so that edits go live without pressing Run workflow.
# Only people who have consented are in the repository at all (see src/lib/people.ts).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (banner + noindex) or live'
        type: choice
        options: [preview, live]
        default: preview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW: ${{ inputs.mode == 'preview' }}
      PUBLIC_PREVIEW: ${{ inputs.mode == 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Launch / preview check
        run: npm run check-launch
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
